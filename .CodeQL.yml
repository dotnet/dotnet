# This file is auto-generated from .CodeQL.yml and CodeQL.yml files in src/.
# Manual changes will be overwritten.

path_classifiers:
  library:
    # --- dotnet/source-build-assets ---
    - "src/source-build-assets/src/externalPackages/src/azure-activedirectory-identitymodel-extensions-for-dotnet/**"

queries:
  # --- dotnet/msbuild ---
  # [Serializable] on MSBuild exception/event types only preserves legacy .NET Framework
  # serialization compatibility (and is [Obsolete(SYSLIB0051)] on modern .NET).
  # In the unified VMR build, cs/dangerous-deserialization-routine traces a false-positive
  # static call graph from SerializationInfo.GetString/GetValue through virtual
  # IFormatterConverter.ToString/TextWriter.Flush dispatches into unrelated build tools.
  # Actual deserialization call sites remain covered by cs/dangerous-binary-deserialization,
  # cs/binary-formatter-without-binder, and cs/unsafe-deserialization-untrusted-input.
  - exclude:
      queryid:
      - "cs/dangerous-deserialization-routine"
      path:
      - src/msbuild
