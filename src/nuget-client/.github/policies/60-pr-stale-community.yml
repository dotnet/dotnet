id: 
name: GitOps.StalePRsCommunity
description: Stale PR management for PRs from the Community.
owner: 
resource: repository
disabled: false
where: 
configuration:
  resourceManagementConfiguration:
    scheduledSearches:
    - description: '[60-11] Search for community PRs with no activity over 7 days and warn.'
      frequencies:
      - hourly:
          hour: 3
      filters:
      - hasLabel:
          label: Community
      - noActivitySince:
          days: 7
      - isPullRequest
      - isOpen
      - isNotLabeledWith:
          label: Status:No recent activity
      actions:
      - addLabel:
          label: Status:No recent activity
      - addReply:
          reply: This PR has been automatically marked as stale because it has no activity for **7 days**. It will be closed if no further activity occurs **within another 30 days** of this comment. If it is closed, you may reopen it anytime when you're ready again, as long as you don't delete the branch.
    - description: '[60-21] Close PRs with no activity over 30 days after warn.'
      frequencies:
      - hourly:
          hour: 3
      filters:
      - isPullRequest
      - isOpen
      - hasLabel:
          label: Status:No recent activity
      - hasLabel:
          label: Community
      - noActivitySince:
          days: 30
      actions:
      - closeIssue
    eventResponderTasks:
    - description: '[60-30] Label community PRs'
      if:
      - payloadType: Pull_Request
      - or:
        - isAction:
            action: Opened
        - isAction:
            action: Reopened
      - activitySenderHasPermission:
          permission: Read
      - not:
          isActivitySender:
            user: 'nuget-client '
            issueAuthor: False
      - not:
          hasLabel:
            label: Community
      then:
      - addLabel:
          label: Community
onFailure: 
onSuccess: 
